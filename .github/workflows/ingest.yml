name: Refresh listings from OpenStreetMap

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC (3:17am Houston)
  workflow_dispatch:
    inputs:
      states:
        description: 'Optional comma-separated states (e.g. TX,GA). Blank = all 50 + DC'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/ingest-osm.mjs
        env:
          SUPABASE_URL: https://isvunzeeanjvczcowses.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATES: ${{ github.event.inputs.states }}
