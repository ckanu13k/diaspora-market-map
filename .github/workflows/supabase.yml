name: Deploy Supabase payment functions

# Database schema: paste supabase/migrations/*.sql into the Supabase SQL Editor (already done for the first one).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Set function secrets
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            STRIPE_PRICE_MONTHLY="${{ secrets.STRIPE_PRICE_MONTHLY }}" \
            STRIPE_PRICE_YEARLY="${{ secrets.STRIPE_PRICE_YEARLY }}" \
            APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Deploy edge functions
        run: |
          supabase functions deploy create-checkout --project-ref "$PROJECT_REF"
          supabase functions deploy customer-portal --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook  --project-ref "$PROJECT_REF" --no-verify-jwt
