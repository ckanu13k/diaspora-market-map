name: Refresh listings from Overture Maps

# Overture publishes a new places release roughly monthly. This job extracts US African/Caribbean
# markets & restaurants, commits them to data/, and Supabase's ingest-places function (pg_cron,
# every 10 min) imports the new release automatically. No secrets needed.
# Each run also checks every listed website (dead, parked or wrong ones are dropped) and pulls
# free machine-readable menus / product lists. See scripts/web/check.mjs.
on:
  schedule:
    - cron: '23 8 * * 1'   # weekly check (Mondays 08:23 UTC); commits only when data changed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check websites and report, but do not commit data'
        type: boolean
        default: false
      web_states:
        description: 'Only check websites in these states (e.g. TX,GA); blank = all'
        type: string
        default: ''
      report_key:
        description: 'Public key (JWK JSON) to encrypt a per-site report with; blank = no report'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install duckdb==2.0.0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Extract from Overture (public S3)
        run: python scripts/overture/extract.py /tmp/overture_raw.jsonl
      - name: Classify, check websites, split by state
        run: node scripts/overture/build.mjs /tmp/overture_raw.jsonl
        env:
          WEB_CHECK: '1'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          WEB_STATES: ${{ inputs.web_states }}
          WEB_REPORT_KEY: ${{ inputs.report_key }}
      - name: Save encrypted website report to the web-report branch
        if: ${{ inputs.report_key != '' }}
        run: |
          [ -f /tmp/web-report.enc.json ] || exit 0
          cd /tmp && rm -rf rep && mkdir rep && cd rep && git init -q -b web-report
          cp /tmp/web-report.enc.json report.enc.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.enc.json && git commit -qm "Encrypted website check report"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-report
      - name: Commit if changed
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Listings: Overture $(jq -r .release data/manifest.json) ($(jq -r .total data/manifest.json) places)"
          git push
