name: Refresh listings from Overture Maps

# Overture publishes a new places release roughly monthly. This job extracts US African/Caribbean
# markets & restaurants, commits them to data/, and Supabase's ingest-places function (pg_cron,
# every 10 min) imports the new release automatically. No secrets needed.
on:
  schedule:
    - cron: '23 8 * * 1'   # weekly check (Mondays 08:23 UTC); commits only when data changed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install duckdb==2.0.0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Extract from Overture (public S3)
        run: python scripts/overture/extract.py /tmp/overture_raw.jsonl
      - name: Classify and split by state
        run: node scripts/overture/build.mjs /tmp/overture_raw.jsonl
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Listings: Overture release $(jq -r .release data/manifest.json) ($(jq -r .total data/manifest.json) places)"
          git push
