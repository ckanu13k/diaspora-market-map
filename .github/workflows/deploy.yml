name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'   # hourly: refresh the cached map snapshot so the CDN copy stays current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tests (database rules + ingestion mapping)
        run: npm test
      - name: Snapshot the public map layer (served from the CDN)
        run: npm run snapshot
        continue-on-error: true   # the app falls back to loading from the database directly
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PRICE_MONTHLY_LABEL: ${{ vars.PRICE_MONTHLY_LABEL }}
          VITE_PRICE_YEARLY_LABEL: ${{ vars.PRICE_YEARLY_LABEL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
