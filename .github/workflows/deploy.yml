name: Tests + old-address redirect

# The app itself is built and hosted by Cloudflare Pages (diaspora-market-map.pages.dev),
# which rebuilds on every push to main and refreshes the map data at the edge.
# This workflow runs the test suite and keeps the old GitHub Pages address
# forwarding visitors (and installed home-screen apps) to the new one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tests (database rules, ingestion mapping, snapshot format)
        run: npm test

  redirect-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build redirect site
        run: |
          mkdir -p site
          cp redirect/index.html site/index.html
          cp redirect/index.html site/404.html
          cp redirect/sw.js site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  redirect:
    needs: redirect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
